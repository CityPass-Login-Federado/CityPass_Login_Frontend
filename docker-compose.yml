services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://host.docker.internal:8081}
    image: citypass-login-frontend:local
    container_name: citypass-login-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
