name: PR Checks

on:
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ "main", "develop" ]

env:
  NODE_VERSION: "20"

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------------------------------------------------------------
  # 1) Build, Lint, Type-Check y Tests (Node / React)
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build, Lint & Test (React + TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # Instala dependencias solo si existe package.json
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found yet. Skipping dependency install."
          fi

      # Verifica sintaxis/errores de TypeScript sin emitir JS
      - name: Type Check (TypeScript)
        run: |
          if [ -f package.json ]; then
            npm run tsc --if-present || npx tsc --noEmit
          fi

      # Linter de código (ESLint)
      - name: Linting
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          fi

      # Pruebas unitarias (Vitest / Jest) y build de producción
      - name: Build & Test
        run: |
          if [ -f package.json ]; then
            npm test -- --watchAll=false --if-present
            npm run build --if-present
          fi

  # ---------------------------------------------------------------------
  # 2) Secret scanning sobre la raíz del repositorio (Gitleaks)
  # ---------------------------------------------------------------------
  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -zxvf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks CLI
        run: |
          gitleaks detect \
            --source=. \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --verbose \
            --redact

      - name: Subir resultados SARIF a GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
