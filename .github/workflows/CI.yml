name: CI

on:
  workflow_call:

env:
  NODE_VERSION: "22"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Lint & Test (React + TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Linting
        run: npm run lint --if-present

      - name: Unit tests with coverage
        run: npm run test:coverage -- --run

      - name: Production build
        run: npm run build --if-present

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  sonar:
    name: SonarQube
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate coverage report for Sonar
        run: npm run test:coverage -- --run

      - name: Verify coverage
        run: |
          pwd
          ls -lah coverage
          test -f ./coverage/lcov.info
          echo "LCOV encontrado:"
          wc -l ./coverage/lcov.info
          grep '^SF:' ./coverage/lcov.info | head -20

      - name: Set up Java 21 for SonarCloud
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🔎 Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: citypass-login-federado
          SONAR_PROJECT_KEY: citypass-login-federado_citypass-login-frontend
        run: |
          npx sonar-scanner \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="src/**/*.test.ts,src/**/*.test.tsx" \
            -Dsonar.exclusions="dist/**,coverage/**,node_modules/**,src/**/*.d.ts" \
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov.info

  secret-scanning:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -zxvf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks CLI
        run: |
          gitleaks detect \
            --source=. \
            --report-format=sarif \
            --report-path=gitleaks-results.sarif \
            --verbose \
            --redact || true

      - name: Upload SARIF results to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  iac-scanning:
    name: IaC Scanning (Trivy)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Trivy - config scan for Docker and compose
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac-results.sarif
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Trivy - summary in logs
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: .
          format: table
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac

  docker-image-scanning:
    name: Docker Image Scanning (Trivy)
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build image locally without pushing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ghcr.io/citypass-login-federado/citypass-login-frontend:ci-test

      - name: Trivy - image scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/citypass-login-federado/citypass-login-frontend:ci-test
          format: sarif
          output: trivy-image-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload image SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@d8073367669608af8fbcc5f63dd0a0d52bb90cff
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image
          if-no-files-found: ignore
